# Publishes the Tilbud Radar web app (public/) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy Tilbud Radar to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Pages lets browsers cache files for 10 minutes; versioned URLs make every deploy show up at once.
      - name: Version asset URLs
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s#(href|src)=\"([a-z]+\.(css|js|webmanifest|svg))\"#\1=\"\2?v=$V\"#g; s#build dev#build $V#" public/index.html
          sed -i -E "s#from '\./([a-z]+\.js)'#from './\1?v=$V'#g" public/*.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
